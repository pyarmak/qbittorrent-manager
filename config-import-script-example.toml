# Example qBittorrent Manager Configuration for Import Script Mode
# This configuration enables the new import script approach where Sonarr/Radarr
# handle their own imports via the provided script, and qbit-manager handles
# background copying and smart space management with streaming checks.

[general]
timezone = "America/New_York"
puid = 1000
pgid = 1000
log_level = "INFO"
dry_run = false

[paths]
[paths.downloads]
# SSD cache for fast downloads
ssd = "/downloads/ssd"
# HDD for long-term storage
hdd = "/downloads/hdd"

[paths.config]
base = "/config"
logs = "/config/log"
state = "/config/qbit-manager-state"

[qbittorrent]
host = "qbittorrent"
port = 8080
username = "admin"
password = "your-qbit-password"
verify_ssl = false

[http_service]
enabled = true
host = "0.0.0.0"
port = 8081
api_key = "your-secure-random-api-key-here"

[processing]
[processing.concurrency]
max_concurrent = 3

[processing.storage]
threshold_gb = 100

[processing.copy]
retry_attempts = 3
verification_enabled = true

[notifications]
enabled = false  # Disabled in import script mode - Sonarr/Radarr handle their own imports

[notifications.sonarr]
url = "http://sonarr:8989"
api_key = "your-sonarr-api-key-here"
tag = "sonarr"

[notifications.radarr]
url = "http://radarr:7878"
api_key = "your-radarr-api-key-here"
tag = "radarr"

[storage_tags]
enabled = true
auto_tag_new = true
ssd_tag = "ssd"
hdd_tag = "hdd"

# ===================================================================
# NEW: Import Script Mode Configuration
# ===================================================================

[import_script]
# Enable import script mode (Sonarr/Radarr handle imports via script)
enabled = true

# EXPERIMENTAL: Also notify Sonarr/Radarr when downloads complete
# This might speed up detection without polling, but could cause conflicts
# with the import script. Enable with caution and monitor logs.
notify_arr_experimental = false

# Root folder paths where Sonarr/Radarr store media
# These are used for symlink discovery during space management.
#
# Requirements:
#  - use the path as Sonarr/Radarr see it, and mount it into qbit-manager at
#    that same path (qbit-manager opens the paths the arr API reports)
#  - it must be on the same filesystem as paths.downloads.hdd, because the
#    library entries are converted to hardlinks pointing at the HDD copy
sonarr_root_folders = [
    "/downloads/sonarr",
    "/downloads/tv-shows"
]

radarr_root_folders = [
    "/downloads/radarr", 
    "/downloads/movies"
]

# Tautulli configuration for streaming checks
tautulli_url = "http://tautulli:8181"
tautulli_api_key = "your-tautulli-api-key-here"

# Path mappings for different container mounts
# Format: qbit-manager-path = plex-container-path
#
# Tautulli reports the path Plex scanned, which is the file inside the
# Sonarr/Radarr root folder above - not the torrent's download path, which Plex
# only ever reaches by following a symlink. So the mapping that decides whether
# the "currently streaming" check works is the one covering your root folders.
# Map the download paths too if a Plex library also points directly at them.
[import_script.path_mappings]
"/downloads" = "/Downloads"
"/downloads/ssd" = "/mnt/ssd-cache/flood"

# ===================================================================
# Setup Instructions for Import Script Mode:
# ===================================================================
# 
# 1. Copy scripts/sonarr-radarr-import.sh to your Sonarr/Radarr containers
# 2. Make it executable: chmod +x /path/to/sonarr-radarr-import.sh
# 3. In Sonarr: Settings -> Media Management -> Importing
#    (enable "Show Advanced" to reveal these):
#    - Enable "Use Script Import"
#    - Set "Script Import Path" to the script location
# 4. In Radarr: Settings -> Media Management -> Importing
#    (enable "Show Advanced" to reveal these):
#    - Enable "Use Script Import" 
#    - Set "Script Import Path" to the script location
# 5. Configure the root folder paths above to match your setup
# 6. Set up Tautulli API access for streaming checks
# 7. Configure path mappings if your containers have different mount points
#
